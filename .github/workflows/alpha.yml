name: Script Alpha v9.2 CI

on:
  push:
    branches: [ main, master, v9.2 ]
  pull_request:
    branches: [ main, master, v9.2 ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Run Deployment Verification Checklist
      run: npm run verify

    - name: Run Concurrency Stress Suite
      run: npm run stress

    - name: Run CI Fault Simulation (Assert Exit Code 2)
      run: |
        node test_ci_failure_simulation.js && exit 1 || echo "[VERIFIED] Fault simulation correctly triggered exit code 2."
