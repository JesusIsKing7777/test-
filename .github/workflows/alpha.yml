name: Script Alpha v9.2 Dual-OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ubuntu-hybrid-spine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify C++ compiler & run full v9.2 suite (CI strict)
        env:
          CI: 'true'
          ALPHA_TELEMETRY_HMAC_KEY: 'ci-matrix-32-byte-hmac-test-key!'
        run: |
          g++ --version
          bash run_full_v92_suite.sh

  macos-coreml-wordpiece:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run CoreMLBridge + WordPieceParityTests via SwiftPM
        run: |
          PKG="$RUNNER_TEMP/CoreMLTestPkg"
          mkdir -p "$PKG/Sources/CoreMLBridge" "$PKG/Tests/CoreMLBridgeTests"
          cp native_bridge/ios/CoreMLBridge.swift "$PKG/Sources/CoreMLBridge/"
          printf 'import CoreMLBridge\n' | cat - native_bridge/ios/Tests/WordPieceParityTests.swift > "$PKG/Tests/CoreMLBridgeTests/WordPieceParityTests.swift"
          cat << 'PKG_EOF' > "$PKG/Package.swift"
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "CoreMLBridge",
              platforms: [.macOS(.v13)],
              targets: [
                  .target(name: "CoreMLBridge"),
                  .testTarget(name: "CoreMLBridgeTests", dependencies: ["CoreMLBridge"])
              ]
          )
          PKG_EOF
          swift test --package-path "$PKG"
