global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'engine']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 3h
  receiver: 'alpha-webhook-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'alpha-webhook-receiver'
      continue: true

receivers:
  - name: 'alpha-webhook-receiver'
    webhook_configs:
      - url: 'http://localhost:8080/api/v1/alerts'
        send_resolved: true
        max_alerts: 10
